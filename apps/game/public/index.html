<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#16131f">
  <title>Stickman Ruins</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script type="importmap">
    { "imports": {
      "three": "/three/build/three.module.js",
      "three/addons/": "/three/examples/jsm/",
      "@pvp/game-rules": "/packages/game-rules/src/index.js",
      "@pvp/api-client": "/packages/api-client/src/index.js",
      "@pvp/shop-catalog": "/packages/shop-catalog/src/index.js",
      "@pvp/seeded-random": "/packages/seeded-random/src/index.js",
      "@pvp/collision": "/packages/collision/src/index.js",
      "@pvp/world-gen": "/packages/world-gen/src/index.js",
      "@pvp/stickman-3d": "/packages/stickman-3d/src/index.js",
      "@pvp/touch-controls": "/packages/touch-controls/src/index.js",
      "@pvp/net-protocol": "/packages/net-protocol/src/index.js"
    } }
  </script>
</head>
<body>
  <canvas id="view"></canvas>

  <!-- Login -->
  <section id="login" class="screen">
    <div class="panel narrow">
      <h1 class="logo">STICKMAN<br><span>RUINS</span></h1>
      <input id="loginName" placeholder="Player name" maxlength="16" autocomplete="username">
      <input id="loginPass" type="password" placeholder="Password" autocomplete="current-password">
      <div class="row">
        <button id="btnLogin" class="big">Log in</button>
        <button id="btnSignup" class="big alt">Sign up</button>
      </div>
      <p id="loginError" class="error"></p>
    </div>
  </section>

  <!-- Main menu -->
  <section id="menu" class="screen hidden">
    <header class="topbar">
      <div class="who"><span id="menuName"></span></div>
      <div class="coins"><span class="coin"></span><span id="menuCoins">0</span></div>
    </header>
    <div class="menu-body">
      <h1 class="logo small">STICKMAN <span>RUINS</span></h1>
      <div id="menuMessage" class="message hidden"></div>
      <div class="menu-buttons">
        <button id="btnJoin" class="huge">JOIN ARENA</button>
        <button id="btnShop" class="huge alt">SHOP</button>
      </div>
      <p class="online"><span class="dot"></span><span id="menuOnline">0</span> players in the arena</p>
      <p id="menuBackpack" class="backpack"></p>
      <button id="btnLogout" class="link">Log out</button>
    </div>
  </section>

  <!-- Shop -->
  <section id="shop" class="screen hidden">
    <header class="topbar">
      <button id="btnShopBack" class="back">‹ Back</button>
      <div class="coins"><span class="coin"></span><span id="shopCoins">0</span></div>
    </header>
    <nav class="tabs">
      <button data-tab="color" class="active">Colors</button>
      <button data-tab="hat">Hats</button>
      <button data-tab="face">Masks</button>
      <button data-tab="back">Back</button>
      <button data-tab="shirt">Clothes</button>
      <button data-tab="weapon">Weapons</button>
    </nav>
    <p id="shopHint" class="hint"></p>
    <div id="shopGrid" class="grid"></div>
    <p id="shopError" class="error"></p>
  </section>

  <!-- In-game HUD -->
  <section id="hud" class="hidden">
    <div class="crosshair"><i></i><i></i><i></i><i></i></div>
    <div id="hitmark" class="hitmark">✕</div>
    <div id="banner" class="banner hidden"></div>
    <div id="feed" class="feed"></div>
    <div class="hud-top">
      <button id="btnLeave" class="leave">⟵ Menu</button>
      <div class="hud-info">
        <span class="pill"><span class="coin"></span><b id="hudCoins">0</b></span>
        <span class="pill">👥 <b id="hudPlayers">1</b></span>
      </div>
    </div>
    <div id="compass" class="compass hidden">★ <span id="compassDist"></span></div>
    <div id="slots" class="slots"></div>
    <div class="health">
      <div class="hpbar"><div id="hpFill"></div><span id="hpText">100</span></div>
      <div class="heals">
        <button id="btnBandage" class="heal">🩹 <b id="bandageCount">0</b></button>
        <button id="btnMedkit" class="heal">💊 <b id="medkitCount">0</b></button>
      </div>
    </div>
    <div id="toast" class="toast"></div>

    <button id="btnOpen" class="tbtn open hidden">OPEN</button>

    <!-- touch controls -->
    <div id="touch" class="touch">
      <div id="stick" class="stick"><div id="knob" class="knob"></div></div>
      <button id="btnFire" class="tbtn fire">🎯</button>
      <button id="btnJump" class="tbtn jump">⤒</button>
      <button id="btnCrouch" class="tbtn crouch">⤓</button>
    </div>
    <p id="keysHelp" class="keys hidden">WASD move · Shift run · Space jump · C crouch/slide · Click shoot · E open · 1-5 weapons · Q bandage · F medkit · Esc free mouse</p>
  </section>

  <!-- Knocked out -->
  <section id="dead" class="screen hidden">
    <div class="panel narrow center">
      <div class="poof">💫</div>
      <h2>Knocked out!</h2>
      <p id="deadBy"></p>
      <p class="muted">You dropped your weapons on the island.</p>
      <button id="btnDeadMenu" class="big">Back to menu</button>
    </div>
  </section>

  <div id="loading" class="loading hidden">Connecting…</div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
